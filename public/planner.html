<title>NOVOOI Romplanlegger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: tool panel | 3D/2D stage | furniture catalog. */
/* NOVOOI-merkevare: bytt verdiene under for å justere fargene i hele verktøyet */
:root{
  --bg:#F5F5F3; --panel:#FFFFFF; --panel2:#F5F5F3; --ink:#111111; --muted:#6F6F6B; --line:#E3E3E0;
  --accent:#111111; --accent-ink:#FFFFFF; --accent-soft:#EDEDEA; --stage:#F2F2EF; --danger:#B3261E; --warn:#A86B00;
  --cap:#2A2A2A; --grid:#74746E; --hl:#3D6FD8;
  --f-display:var(--f-body);
  --f-body:"DM Sans", sans-serif;
  --f-mono:var(--f-body);
  --r:2px; --rs:2px; --shadow:none;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Header */
.top{background:var(--panel);border-bottom:1px solid var(--line)}
@media(max-width:700px){.brand img{width:100px;height:auto}}
.top{height:58px;display:flex;align-items:center;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:14px;white-space:nowrap}.brand img{display:block;width:126px;height:28px;object-fit:contain;flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.14em}
.brand span{color:var(--muted);font-size:13px}
.title-in{border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;font-weight:600;min-width:0;width:220px}
.title-in:hover{border-color:var(--line)}
.title-in:focus{border-color:var(--accent);background:var(--panel);outline:none}
.top .sp{flex:1}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);transition:background .15s,border-color .15s}
.ibtn:hover{border-color:var(--muted)}
.ibtn:disabled{opacity:.4;cursor:default}
.ibtn svg{width:18px;height:18px;flex:none}
.pill-total{display:flex;align-items:center;gap:10px;height:38px;padding:0 6px 0 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);border:0;font-weight:600}
.pill-total .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill-total .cnt{background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:12px}
:root[data-theme="dark"] .pill-total .cnt{background:rgba(0,0,0,.15)}

/* App grid */
.app{height:calc(100% - 58px);display:grid;grid-template-columns:300px minmax(0,1fr) 344px;gap:12px;padding-bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
.app.nopanel{grid-template-columns:minmax(0,1fr) 344px}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pclose{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:2px 4px;border-radius:var(--rs)}
.pclose:hover{color:var(--ink);background:var(--panel2)}
.paint span small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.roompop{position:absolute;left:12px;bottom:52px;z-index:20;width:300px;max-width:calc(100% - 24px);background:var(--panel);border:1px solid var(--line);border-radius:var(--rs);padding:14px;display:grid;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.st-info .chip.btnchip{pointer-events:auto;cursor:pointer}
.st-info .chip.btnchip:hover{border-color:var(--ink)}
.app.nopanel .lp{display:none}
.surf{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-height:0}

/* Left panel */
.lp{overflow:auto;padding:18px 18px 22px}
.ph h2{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.ph p{margin:2px 0 0;color:var(--muted)}
.sec{margin-top:20px;display:grid;gap:10px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shape{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 4px 6px;display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--muted)}
.shape svg{width:34px;height:28px}
.shape:hover{border-color:var(--accent);color:var(--ink)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.num{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
.num input{border:0;background:transparent;width:100%;min-width:0;padding:8px 4px 8px 10px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.num input:focus{outline:none}
.num:focus-within{border-color:var(--accent)}
.num span{padding-right:10px;color:var(--muted);font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.walls{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.walls li{display:grid;grid-template-columns:auto 1fr 112px;align-items:center;gap:10px}
.wdot{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.15)}
.wname{border:0;background:none;text-align:left;padding:4px 0;font-weight:500}
.wname[aria-current="true"]{color:var(--accent);font-weight:700}
.stats{display:flex;gap:16px;padding:12px 14px;background:var(--panel2);border-radius:10px}
.stats div{display:grid}
.stats small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.stats b{font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:12.5px;margin:0;line-height:1.5}
.hint kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 4px;background:var(--panel2)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;background:var(--panel2)}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:7px 8px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.45;cursor:default}
.paints{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paint{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0;overflow:hidden;text-align:left}
.paint i{display:block;height:44px;border-bottom:1px solid var(--line)}
.paint span{display:block;padding:5px 8px;font-size:12px}
.paint[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.custom{display:flex;align-items:center;gap:10px;font-size:13px}
.custom input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:2px}
.floors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.floor{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:0;overflow:hidden;text-align:left}
.floor img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;max-width:100%}
.floor span{display:block;padding:6px 9px;font-size:12.5px}
.floor[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}

/* Stage */
.stage{position:relative;overflow:hidden;background:var(--stage);touch-action:none;border-radius:var(--r);border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%;outline:none}
.st-top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.st-top>*{pointer-events:auto}
.st-top .sp{flex:1}
.vseg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;box-shadow:var(--shadow)}
.vseg button{border:0;background:transparent;border-radius:7px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.vseg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tools{display:flex;flex-direction:column;gap:6px}
.tools .ibtn{box-shadow:var(--shadow)}
.tools .ibtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.st-info{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;pointer-events:none;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;box-shadow:var(--shadow);color:var(--muted)}
.chip b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.st-hint{position:absolute;right:12px;bottom:12px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;pointer-events:none;box-shadow:var(--shadow)}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hc{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--panel);border:3px solid var(--accent);pointer-events:auto;cursor:move;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.hc.iwh.selected{background:var(--accent);outline:3px solid var(--hl);outline-offset:3px}
.hc:hover{transform:scale(1.2)}
.hc.iwh{width:14px;height:14px;margin:-7px 0 0 -7px;border-width:2px;border-radius:3px}
.ha{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;pointer-events:auto;display:grid;place-items:center;font-weight:700;font-size:15px;line-height:1;opacity:.0;transition:opacity .15s;touch-action:none;cursor:copy}
.stage:hover .ha,.ha:focus-visible{opacity:.85}
.ha:hover{opacity:1}
.dim{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-family:var(--f-mono);font-size:12px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.12);cursor:text}
.dim:hover{border-color:var(--accent)}
.dim small{color:var(--muted);margin-right:5px;font-family:var(--f-body);font-weight:600}
.dim input{width:64px;border:0;background:transparent;font-family:var(--f-mono);font-size:12px;padding:0;outline:none}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);border-radius:6px;padding:3px 8px;font-family:var(--f-mono);font-size:11.5px;white-space:nowrap;pointer-events:none}

/* Selection bar */
.selbar{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 8px;box-shadow:0 10px 30px rgba(0,0,0,.14);max-width:calc(100% - 24px)}
.selbar img{width:46px;height:36px;object-fit:contain;border-radius:8px;background:var(--panel2)}
.selbar .nm{display:grid;min-width:0}
.selbar .nm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.selbar .nm span{font-size:12px;color:var(--muted)}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw button{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.selbar .acts{display:flex;gap:4px}
.selbar .ibtn{height:34px;min-width:34px;padding:0 8px}
.selbar .del:hover{color:var(--danger);border-color:var(--danger)}
.vsep{width:1px;align-self:stretch;background:var(--line)}

/* Catalog */
.cat{display:flex;flex-direction:column;overflow:hidden}
.ctabs{display:flex;gap:4px;padding:10px 10px 0}
.ctabs button{flex:1;border:0;background:transparent;padding:10px 6px;border-bottom:2px solid transparent;font-weight:600;color:var(--muted)}
.ctabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.cbody{flex:1;overflow:auto;padding:14px 14px 18px;display:grid;align-content:start;gap:14px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--panel2)}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;padding:9px 0;width:100%;outline:none}
.search:focus-within{border-color:var(--accent)}
.cats{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:2px}
.cats button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.upl{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;justify-items:start;background:var(--panel2);transition:border-color .15s,background .15s}
.upl.over{border-color:var(--accent);background:var(--accent-soft)}
.upl b{font-weight:600}
.upl p{margin:0;font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:9px;padding:8px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.imp{border:1px solid var(--accent);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--panel)}
.imp .row{display:flex;gap:8px;flex-wrap:wrap}
.imp .err{color:var(--danger);font-size:13px}
.imp label.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.txt{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--panel);width:100%}
.txt:focus{outline:none;border-color:var(--accent)}
select.txt{appearance:auto}
.note{font-size:12px;color:var(--muted);margin:0;padding:8px 10px;border-radius:9px;background:var(--panel2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;position:relative;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent)}
.card .th{aspect-ratio:4/3;background:var(--panel2);display:grid;place-items:center;max-width:100%}
.card .th img{width:100%;height:100%;object-fit:contain}
.card .meta{padding:8px 10px 10px;display:grid;gap:1px}
.card .meta b{font-weight:600;font-size:13px;line-height:1.3}
.card .meta small{color:var(--muted);font-family:var(--f-mono);font-size:11px}
.card .meta span{font-family:var(--f-mono);font-size:12.5px;margin-top:3px}
.card .add{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:18px;font-weight:600;opacity:0;transition:opacity .15s}
.card:hover .add,.card:focus-visible .add{opacity:1}
.card .badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted)}
.card .rm{position:absolute;bottom:8px;right:8px;border:1px solid var(--line);background:var(--panel);border-radius:7px;font-size:11px;padding:2px 7px;color:var(--muted)}
.card .rm.arm{color:#fff;background:var(--danger);border-color:var(--danger)}
.empty{color:var(--muted);text-align:center;padding:24px 10px;font-size:13px}
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px 6px 6px;background:var(--panel);text-align:left}
.li[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.li img{width:52px;height:40px;object-fit:contain;background:var(--panel2);border-radius:7px}
.li b{font-weight:600;font-size:13px;display:block}
.li small{color:var(--muted);font-size:12px}
.li .p{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.sum{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-weight:700;font-size:16px}
.sum .tot span:last-child{font-family:var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:100}
.toast.on{opacity:1;transform:translateX(-50%)}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}

@media (max-width:1180px){
  .app,.app.nopanel{grid-template-columns:minmax(0,1fr) 320px}
  .app .lp{position:absolute;z-index:30;top:0;bottom:14px;left:calc(max(16px,env(safe-area-inset-left,0px)) + 12px);width:300px;box-shadow:0 14px 40px rgba(0,0,0,.18)}
}
@media (max-width:780px){
  body{overflow:auto}
  html,body{height:auto}
  .top{flex-wrap:wrap;height:auto;padding-block:10px;gap:8px}
  .title-in{width:150px}
  .brand span{display:none}
  .app,.app.nopanel{display:flex;flex-direction:column;height:auto}
  .stage{order:0;height:62vh;min-height:360px}
  .app .lp{order:2;position:static;width:auto;box-shadow:var(--shadow)}
  .cat{order:3;max-height:none}
  .cbody{overflow:visible}
  .selbar{bottom:48px;flex-wrap:wrap;justify-content:center}
  .st-hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* NOVOOI-stil: flate flater, rette kanter, små versaletiketter */
.surf,.stage{border-radius:var(--r)}
.ibtn,.shape,.num,.paint,.floor,.seg,.seg button,.vseg,.vseg button,.search,.upl,.btn,.imp,.txt,.card,.li,.note,.stats,.selbar,.selbar img,.li img,.dim,.tag,.card .rm,.card .badge,.pill-total,.pill-total .cnt,.cats button,.chip,.st-hint,.toast,.card .add{border-radius:var(--rs)}

async function shopSync(){if(SS.state!=='idle'||SS.off)return;const driveClient=await getDriveClient();if(!driveClient)return;
  const customs=[...custom.values()].filter(p=>p.rec);SS.state='run';
  try{
    // 1) Find products for models that are not linked yet.
    let todo=customs.filter(p=>!p.shop&&(!p.rec.autoFail||p.rec.autoVer!==2||Date.now()-p.rec.autoFail>AUTO_RETRY));let k=0,hit=0;
    /* Fast path: fetch each brand's whole range in one or two calls and match all its models locally. */
    if(todo.length){const slugs=await brandSlugs();const groups=new Map();todo.forEach(p=>{const s=slugs[normBrand(p.brand)];if(s){if(!groups.has(s))groups.set(s,[]);groups.get(s).push(p)}});
      let gi=0;for(const[slug,ps]of groups){gi++;SS.msg=`Kobler ${ps[0].brand||'merke'} til nettbutikken (${gi} av ${groups.size} merker)`;renderDS();
        let range=[];for(let pg=1;pg<=10;pg++){const a=await shopFetch(`products?brand=${encodeURIComponent(slug)}&per_page=100&page=${pg}&_fields=${PFIELDS}`);if(!Array.isArray(a)||!a.length)break;range=range.concat(a);if(a.length<100)break}
        const matches=[];for(const p of ps){const sc=range.map(c=>({s:scoreCand(p,c),c})).sort((a,b)=>b.s-a.s);
          if(sc[0]&&sc[0].s>=5)matches.push({p,c:sc[0].c});else{p.rec.autoFail=Date.now();p.rec.autoVer=2;p.rec.cands=sc.slice(0,8).map(({c})=>candOf(c));await IDB.put(p.rec)}}
        const varIds=[...new Set(matches.filter(m=>m.c.type==='variable').map(m=>m.c.id))];let vars=[];for(let i=0;i<varIds.length;i+=20)vars=vars.concat(await fetchVars(varIds.slice(i,i+20)));
        for(const m of matches){await attachShop(m.p,buildShop(m.c,vars.filter(v=>v.parent===m.c.id)),true);hit++}}
      todo=todo.filter(p=>!p.shop&&!(p.rec.autoFail&&Date.now()-p.rec.autoFail<60000))}
    for(const p of todo){k++;SS.msg=`Kobler modeller til nettbutikken (${k} av ${todo.length})`;renderDS();
      const c=await findProduct(p);if(c){await attachShop(p,await fetchShop(c.id,c),true);hit++}else{p.rec.autoFail=Date.now();p.rec.autoVer=2;p.rec.cands=p._cands||[];await IDB.put(p.rec)}}
    // 2) Refresh variants and prices for linked products in batches.
    const stale=customs.filter(p=>p.shop&&(Date.now()-(p.shop.at||0)>SHOP_MAXAGE||!p.shop.cats));const ids=[...new Set(stale.map(p=>p.shop.id))];
    for(let i=0;i<ids.length;i+=20){const chunk=ids.slice(i,i+20);SS.msg=`Oppdaterer priser og varianter (${Math.min(i+20,ids.length)} av ${ids.length})`;renderDS();
      const prods=await shopFetch(`products?include=${chunk.join(',')}&per_page=100&_fields=${PFIELDS}`);const list=Array.isArray(prods)?prods:[];
      const varIds=list.filter(x=>x.type==='variable').map(x=>x.id);const vars=varIds.length?await fetchVars(varIds):[];

  catch(e){if(e&&['server_not_connected','not_in_manifest','nomcp','cancelled','not_granted','capability_disabled'].includes(e.code))SS.off=e.code;SS.msg=''}

const AUTO_MAX=30e6,ROOT=DRIVE_ROOT.id,SYNC_VER=3; // raise SYNC_VER when import logic changes, so stored files are processed again

{const _s=ARCS.set.bind(ARCS),_d=ARCS.delete.bind(ARCS);const save=()=>ls.set('novooi-arcs',JSON.stringify([...ARCS]));ARCS.set=(k,v)=>{_s(k,v);save();return ARCS};ARCS.delete=k=>{const r=_d(k);save();return r};

async function syncDrive(manual){if(DS.state!=='idle'){if(manual)toast('Synkroniseringen pågår allerede');return}
  const driveClient=await getDriveClient();if(!driveClient){DS.err={code:'nomcp'};renderDS();return}
  DS.state='scan';DS.err=null;DS.msg='Leter etter 3D-filer i 4. Brands…';renderDS();
  try{const files=await NOVOOI_LIBRARY.collect({technicalOnly:true,onProgress:folders=>{DS.msg='Leter i produktbiblioteket · '+folders+' mapper';renderDS()}});const idx=files.filter(isModelFile).map(f=>({id:f.id,title:f.title,size:+f.fileSize||0,mod:f.modifiedTime||'',brand:f.brand,path:f.path}));const unknown=0;
    saveFC();idx.sort((a,b)=>a.brand.localeCompare(b.brand,'nb')||a.title.localeCompare(b.title,'nb'));DS.index=idx;DS.at=Date.now();ls.set('novooi-drive-index',JSON.stringify({index:idx,at:DS.at}));

 const b=itemBounds(it);const near=S.items.filter(o=>o.u!==it.u&&!o.hidden&&product(o.pid)&&!isOpening(product(o.pid))).map(o=>{const ob=itemBounds(o);return ob.top>b.bottom&&b.top>ob.bottom&&!NovooiCore.overlaps(b,ob)?{...NovooiCore.closest(b,ob),other:o.u}:null}).filter(Boolean).filter(e=>e.gap>=0).sort((a,b)=>a.gap-b.gap).slice(0,2);return entries.concat(near.map(e=>({...e,kind:'object',label:objectName(S.items.find(x=>x.u===e.other))})))}
function editMeasurement(entry){const it=selItem();if(!it||it.locked){lockNotice();return}const dialog=showDesignDialog('Avstand til '+entry.label,`<form id="distanceForm"><label>Avstand mellom kantene (cm)<input name="gap" class="txt" type="number" min="0" max="10000" step="0.1" value="${entry.gap.toFixed(1)}" required></label><div class="design-actions"><button class="btn">Bruk avstand</button><button class="btn ghost" type="button" id="cancelDistance">Avbryt</button></div></form>`);$('#cancelDistance').onclick=()=>dialog.close();$('#distanceForm').onsubmit=e=>{e.preventDefault();if(it.locked)return;const desired=Number(new FormData(e.target).get('gap'));if(!Number.isFinite(desired)||desired<0)return;const current=measurements(it).find(m=>m.kind===entry.kind&&(m.kind==='wall'?m.wall===entry.wall:m.other===entry.other));if(!current)return;if(current.kind==='object'&&current.gap<.01){toast('Flytt objektet litt fra naboen før du skriver inn en ny avstand.');return}const old={x:it.x,z:it.z};if(current.kind==='wall'){it.x+=current.n.x*(desired-current.gap);it.z+=current.n.z*(desired-current.gap)}else{const dx=(current.a.x-current.b.x)/current.gap,dz=(current.a.z-current.b.z)/current.gap;it.x+=dx*(desired-current.gap);it.z+=dz*(desired-current.gap)}const check={...it};clampInRoom(check);const actual=measurements(it).find(m=>m.kind===entry.kind&&(m.kind==='wall'?m.wall===entry.wall:m.other===entry.other));if(Math.hypot(check.x-it.x,check.z-it.z)>.2||!actual||Math.abs(actual.gap-desired)>.3){Object.assign(it,old);toast('Avstanden kan ikke oppnås her. Flytt objektet først.');return}placeObj(it);updSel();dialog.close();toolsChanged()}}
function updatePlannerTools(){if(!toolPanel)return;updateWallSideMarker();renderTools();const layer=$('#liveMeasures');if(!layer)return;const it=selItem();if(!it||READ_ONLY||presentation||it.locked){layer.hidden=true;return}layer.hidden=false;measureEntries=measurements(it);layer.innerHTML='<svg aria-hidden="true">'+measureEntries.map(m=>{const a=scr(m.a.x*CM,.06,m.a.z*CM),b=scr(m.b.x*CM,.06,m.b.z*CM);return a.vis&&b.vis?`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`:''}).join('')+'</svg>'+measureEntries.map((m,i)=>{const a=scr((m.a.x+m.b.x)*CM/2,.08,(m.a.z+m.b.z)*CM/2);return a.vis?`<button data-measure="${i}" style="left:${a.x}px;top:${a.y}px" title="Endre avstand til ${esc(m.label)}">${m.gap.toFixed(1)} cm</button>`:''}).join('');layer.querySelectorAll('[data-measure]').forEach(b=>b.onclick=e=>{e.stopPropagation();editMeasurement(measureEntries[+b.dataset.measure])})}
function linkedIWEndpoints(iw,end){const p=iw[end];return(S.iwalls||[]).flatMap(w=>['a','b'].filter(e=>!(w===iw&&e===end)&&Math.hypot(w[e].x-p.x,w[e].z-p.z)<.2).map(e=>({w,end:e})))}
function updateWallSideMarker(){let layer=$('#wallSelectionLabels');if(!layer){layer=document.createElement('div');layer.id='wallSelectionLabels';layer.className='wall-selection-labels';stage.appendChild(layer)}const chosen=ui.tab==='walls'&&!ui.applyAll&&!presentation?wallMeshes.filter(m=>selectedWalls.has(m.userData.key)||(m.userData.inner?ui.selIW===m.userData.iwall:ui.selIW==null&&ui.selWall===m.userData.wall)):[];const keys=new Set(chosen.map(m=>m.userData.key));layer.querySelectorAll('[data-wall-label]').forEach(el=>{if(!keys.has(el.dataset.wallLabel))el.remove()});for(const mesh of chosen){const u=mesh.userData,w=wallByKey(u.key);if(!w)continue;let el=[...layer.children].find(el=>el.dataset.wallLabel===u.key);if(!el){el=document.createElement('div');el.className='wall-selection-label';el.dataset.wallLabel=u.key;layer.appendChild(el)}el.textContent=u.inner?'Innervegg '+(u.iwall+1)+' · Side '+(ui.iwSide==='b'?'B':'A'):'Vegg '+letter(u.wall);const point=scr((w.A.x+w.d.x*w.L/2)*CM,ui.mode==='3d'?(u.isLow?.22:S.wallH*CM+.15):.06,(w.A.z+w.d.z*w.L/2)*CM);el.hidden=!point.vis||point.x<0||point.x>stage.clientWidth||point.y<0||point.y>stage.clientHeight;el.style.left=point.x+'px';el.style.top=point.y+'px'}}

function setupPlannerTools(){if(READ_ONLY)return;ui.snap=snapPrefs.walls;toolPanel=document.createElement('aside');toolPanel.className='planner-tool-panel';toolPanel.setAttribute('aria-label','Snapping');toolPanel.hidden=true;toolPanel.innerHTML='<div class="snap-heading"><b>Snapping</b><button id="closeToolPanel" aria-label="Lukk snapping">×</button></div><div class="tool-body"></div>';stage.appendChild(toolPanel);const toggle=$('#snap');toggle.onclick=()=>{toolPanel.hidden=!toolPanel.hidden;toggle.setAttribute('aria-expanded',String(!toolPanel.hidden));toolSignature='';renderTools()};toggle.textContent='Snapping';toggle.title='Tilpass flytting';toggle.setAttribute('aria-label','Snapping');toggle.setAttribute('aria-expanded','false');toggle.removeAttribute('aria-pressed');$('#closeToolPanel').onclick=()=>{toolPanel.hidden=true;toggle.setAttribute('aria-expanded','false');toggle.focus()};toolPanel.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#closeToolPanel').click();e.stopPropagation()}});const measures=document.createElement('div');measures.id='liveMeasures';stage.appendChild(measures);measures.addEventListener('pointerdown',e=>e.stopPropagation());toolPanel.addEventListener('pointerdown',e=>e.stopPropagation());}



/* Phone workspace: keep the canvas visible and open one sheet at a time. */
function setupMobileWorkspace(){
 const mq=matchMedia('(max-width:780px)');
 const nav=document.createElement('nav');nav.className='mobile-nav';nav.setAttribute('aria-label','Arbeidsområde');
 nav.innerHTML='<button data-mobile="stage" aria-pressed="true">'+uiIcon('view')+'<span>Romvisning</span></button><button data-mobile="room" aria-pressed="false">'+uiIcon('view')+'<span>Tilpass rom</span></button><button data-mobile="catalog" aria-pressed="false">'+uiIcon('folder')+'<span>Møbler</span></button><button data-mobile="items" aria-pressed="false">'+uiIcon('folder')+'<span>I rommet</span></button>';
 document.body.appendChild(nav);
 const cat=$('.cat');cat.id='mobileCatalog';
 const close=document.createElement('button');close.className='mobile-sheet-close ibtn';close.textContent='Ferdig ×';close.setAttribute('aria-label','Lukk møbelpanelet og vis rommet');cat.prepend(close);
 function syncNav(){const active=!$('#app').classList.contains('nopanel')?'room':document.body.dataset.mobileSheet==='catalog'?(ui.rtab==='room'?'items':'catalog'):'stage';nav.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.mobile===active));b.setAttribute('aria-expanded',String(b.dataset.mobile===active&&active!=='stage'))})}
 function showCanvas(){document.body.dataset.mobileSheet='';closePanel();syncNav()}
 close.onclick=()=>{showCanvas();nav.querySelector('[data-mobile="stage"]').focus()};
 nav.addEventListener('click',e=>{const b=e.target.closest('[data-mobile]');if(!b)return;const mode=b.dataset.mobile;if(mode==='stage'||b.getAttribute('aria-pressed')==='true'){showCanvas();return}closePanel();document.body.dataset.mobileSheet='';if(mode==='room')openTab('room');else{document.body.dataset.mobileSheet='catalog';$('#'+(mode==='items'?'tRoom':'tCat')).click();cat.querySelector('#cbody').scrollTop=0}syncNav()});
 new MutationObserver(()=>{if(mq.matches&&!$('#app').classList.contains('nopanel'))document.body.dataset.mobileSheet='';syncNav()}).observe($('#app'),{attributes:true,attributeFilter:['class']});
 cat.addEventListener('click',()=>syncNav());
 // Move less frequent header actions into the existing menu on phones.
 const relocations=['undo','redo','shareDesign'].map(id=>{const el=$('#'+id),anchor=document.createComment(id+' desktop position');el.before(anchor);return{el,anchor}});
 const tools=$('.st-top .tools');tools.id='mobileRoomTools';
 const toolToggle=document.createElement('button');toolToggle.className='ibtn mobile-tools-toggle';toolToggle.textContent='Verktøy';toolToggle.setAttribute('aria-controls',tools.id);toolToggle.setAttribute('aria-expanded','false');$('.st-top').appendChild(toolToggle);
 const closeTools=()=>{document.body.classList.remove('mobile-tools-open');toolToggle.setAttribute('aria-expanded','false')};
 toolToggle.onclick=()=>{const open=document.body.classList.toggle('mobile-tools-open');toolToggle.setAttribute('aria-expanded',String(open))};
 for(const id of ['fit','drawW','hideIW']){const label=document.createElement('span');label.className='mobile-tool-label';label.textContent=({fit:'Tilpass visning',drawW:'Tegn innervegg',hideIW:'Skjul innervegger'})[id];$('#'+id).appendChild(label)}
 tools.addEventListener('click',e=>{if(mq.matches&&e.target.closest('button'))closeTools()});
 document.addEventListener('pointerdown',e=>{if(!e.target.closest('.mobile-tools-toggle,.st-top .tools'))closeTools()});
 addEventListener('keydown',e=>{if(e.key==='Escape')closeTools()});
 const update=()=>{for(const {el,anchor}of relocations){if(mq.matches){$('#headerMenu').prepend(el);if(!el.querySelector('span')){const label=document.createElement('span');label.textContent=el.getAttribute('aria-label');el.appendChild(label)}}else{anchor.after(el);if(el.id!=='shareDesign')el.querySelector('span')?.remove()}}if(!mq.matches)document.body.dataset.mobileSheet='';syncNav();requestAnimationFrame(resize)};
 mq.addEventListener('change',update);update();
 addEventListener('keydown',e=>{if(mq.matches&&e.key==='Escape'){showCanvas()}});
 // Selecting a product starts placement: return immediately to the room.
 const originalPlacement=beginPlacement;beginPlacement=function(pid){if(mq.matches)showCanvas();originalPlacement(pid);if(mq.matches&&$('#placementHelp'))$('#placementHelp').textContent='Trykk i rommet for å plassere møbelet';};
 nav.querySelector('[data-mobile="room"]').classList.add('edit-only');
}

setupPolish();setupWorkspaceTools();setupGroundGrid();setupCompactHeader();setupTutorial();setupPlannerTools();
resize();buildRoom();syncItems();setMode('3d');renderAll();commit();loop();setupEnhancedWorkspace();workspaceBooted=true;setupStorageUI();unifyActionIcons();setupFeedback();setupMobileWorkspace();
/* Startup: read only the small model records and show the catalog right away. Geometry loads when a model is placed in the room.
   Models saved by older versions are converted once in the background. */
(async()=>{if(READ_ONLY){await loadSharedDesign();return}await IDB.open();let recs=await IDB.all();
  const legacyArcs=recs.filter(r=>r.archive);for(const r of legacyArcs){if(r.drive&&String(r.id).startsWith('a_d_'))ARCS.set(r.drive,{id:r.id,mod:r.mod||'',ver:r.ver||1});await IDB.put(r,'arcs');await IDB.del(r.id,'models')}
  recs=recs.filter(r=>!r.archive);const ready=[],old=[];recs.forEach(r=>(r.cv===CV&&r.dims?ready:old).push(r));
  ready.forEach(r=>{if(!r.mount){r.mount=guessMount(r.name);r.flip=false}registerLazy(r)});
  syncItems();renderCatBody();renderSelbar();renderTotals();
  const startSync=async()=>{const config=await NOVOOI_LIBRARY.config();if(!config.driveConfigured)return;syncDrive(false);setInterval(()=>{if(document.visibilityState==='visible')syncDrive(false)},15*60*1000)};
  if(!old.length){if(!window.NOVOOI_STATIC)setTimeout(startSync,600);return}
  DS.msg=`Klargjør ${old.length} modeller for rask lasting (bare første gang)`;renderDS();let k=0;
  for(const r of old){await yieldUI();k++;try{const a=r.arc&&await IDB.get(r.arc,'arcs');if(!a||!a.buf)continue;const m=await loadModel({buf:a.buf,name:r.fileName,entry:r.entry});
    /* Re-evaluate orientation and unit for models the user has not adjusted by hand, so improvements apply to models already in the catalog. */
    if(r.upsrc!=='user'){const u=autoUp(m.raw,m.ext);if(upOf(r.zUp)!==u){r.zUp=u}}
    if(!['user','fit'].includes(r.usrc)){const pu=pickUnit(m.raw,r.zUp,r.name,brandKey(r.brand,r.fileName,r.entry));if(pu.unit!==r.unit||pu.src!==r.usrc){r.unit=pu.unit;r.usrc=pu.src;r.fit=1}}
    await storeModel(r,m.raw);if(objs&&S.items.some(i=>i.pid===r.id))forceRebuild(r.id);DS.msg=`Klargjør modeller for rask lasting (${k} av ${old.length}, bare første gang)`;renderDS()}catch(e){}}
  DS.msg='';syncItems();renderCatBody();renderSelbar();renderTotals();if(!window.NOVOOI_STATIC)startSync()})();
})();
